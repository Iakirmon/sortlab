name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy --strict src/
      - name: Pytest
        run: pytest --cov
      - name: Smoke bench
        run: sortlab bench --sizes 100,200,400 --distributions random --repeats 1 --timeout 30 -o benchmarks/results/ci-smoke.json
